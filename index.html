<h1>노래방 리모콘</h1>
<p>유튜브 노래방 영상을 번호로 예약·재생하는 Windows 데스크톱 프로그램입니다. 비상업적 개인 용도로 만들었습니다.</p>
<ul>
<li>곡 제목·가수·유튜브 링크를 등록하면 0001번부터 번호가 붙습니다.</li>
<li>리모콘 키패드로 번호를 눌러 예약하거나 바로 시작합니다.</li>
<li>등록한 곡 목록은 사용자 본인의 구글 드라이브에 "노래모음" 시트로 정리됩니다.</li>
</ul>
